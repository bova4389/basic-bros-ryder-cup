name: Deploy to DreamHost

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          local_path: './*'
          remote_path: '/home/mattbova/basic-bros-ryder-cup.com'
          args: '-o StrictHostKeyChecking=no'

      # Second step is required: the action runs `put -r ./* <remote>`, and sftp's glob
      # does not match leading dots, so ./* silently skips .htaccess. Without this step
      # the no-cache headers never reach the server and mobile Safari serves a stale site.
      - name: Deploy .htaccess
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          local_path: './.htaccess'
          remote_path: '/home/mattbova/basic-bros-ryder-cup.com'
          args: '-o StrictHostKeyChecking=no'

